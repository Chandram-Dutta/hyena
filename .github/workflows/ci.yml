name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-targets --all-features --locked

  dart-adapter:
    name: Dart adapter and vertical slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.10.3
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: dart pub get --enforce-lockfile
        working-directory: adapters/dart
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: adapters/dart
      - run: dart analyze --fatal-infos
        working-directory: adapters/dart
      - run: dart test
        working-directory: adapters/dart
      - run: |
          mkdir -p ../../target
          dart compile exe bin/hyena_dart_adapter.dart -o ../../target/hyena-dart-adapter
        working-directory: adapters/dart
      - name: Exercise the Rust-to-Dart vertical slice
        run: |
          cargo run --quiet -p hyena-cli -- \
            analyze test/fixtures/dart/basic --include-candidates \
            > target/dart-analysis.json
          test "$(jq '.summary.findings' target/dart-analysis.json)" = 2
          test "$(jq '[.findings[] | select(.certainty == "candidateUnused")] | length' target/dart-analysis.json)" = 2
