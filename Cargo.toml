[workspace]
members = [
  "crates/hyena-cli",
  "crates/hyena-engine",
  "crates/hyena-protocol",
  "crates/hyena-syntax",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Chandram Dutta"]
license = "MIT"
repository = "https://github.com/Chandram-Dutta/hyena"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
prost = "0.14"
protoc-bin-vendored = "3.1"
prost-build = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tree-sitter = "0.26"
tree-sitter-dart = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
